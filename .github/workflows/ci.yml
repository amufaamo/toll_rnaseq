name: CI/CD

on:
  push:
    branches:
      - main
      - v4.0-dev
  pull_request:
    branches:
      - main
      - v4.0-dev

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ~/.R/library
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.R/library
          key: ${{ runner.os }}-R-4.5.2-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-R-4.5.2-

      - name: Install dependencies
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages(c("remotes", "rcmdcheck", "BiocManager"))
          BiocManager::install(c("DESeq2", "clusterProfiler"), ask = FALSE, update = FALSE)
          remotes::install_deps(dependencies = c("Depends", "Imports", "LinkingTo"))
        shell: Rscript {0}

      - name: Run rcmdcheck
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error")
        shell: Rscript {0}

  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/amufaamo/easy-rna-seq:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pkgdown:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      R_LIBS_USER: ~/.R/library
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.R/library
          key: ${{ runner.os }}-R-4.5.2-${{ hashFiles('**/DESCRIPTION') }}-pkgdown
          restore-keys: |
            ${{ runner.os }}-R-4.5.2-

      - name: Install dependencies
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
          install.packages(c("remotes", "pkgdown", "BiocManager"))
          BiocManager::install(c("DESeq2", "clusterProfiler"), ask = FALSE, update = FALSE)
          remotes::install_local(dependencies = TRUE)
        shell: Rscript {0}

      - name: Build and deploy site
        run: pkgdown::build_site_github_pages()
        shell: Rscript {0}
